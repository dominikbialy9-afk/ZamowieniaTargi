<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Zamówienia Targi – wybierz halę</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body data-page="halls">
    <div class="app-shell wizard-shell">
      <header class="app-header">
        <div class="header-left">
          <a href="/app/events" class="logo">Zamówienia Targi</a>
          <nav class="wizard-steps" id="wizard-steps" aria-label="Etapy zamówienia"></nav>
        </div>
        <div class="header-actions">
          <div class="user-pill" id="user-pill">Ładowanie użytkownika…</div>
          <button class="secondary" id="logout-btn" type="button">Wyloguj</button>
        </div>
      </header>

      <main class="wizard-content">
        <section class="card">
          <header class="panel-header">
            <div>
              <h1>Wybierz halę dla wydarzenia</h1>
              <p>Połącz zamówienie z konkretnym magazynem. Możesz wrócić do wyboru targów, jeśli potrzebujesz.</p>
            </div>
            <button class="ghost" type="button" onclick="window.location.href='/app/events'">Zmień targi</button>
          </header>
          <div class="selection-summary" id="event-summary"></div>
          <div class="cards-grid" id="hall-grid"></div>
          <footer class="panel-footer">
            <button class="secondary" type="button" onclick="window.location.href='/app/events'">Wstecz</button>
            <button class="primary" id="hall-continue" type="button" disabled>Przejdź do wyboru stoiska</button>
          </footer>
        </section>
      </main>
    </div>

    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
